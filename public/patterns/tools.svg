<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <!--
    Mosaico estilo barbería: rombos de líneas punteadas, estrellas de 4 puntas en los cruces y,
    adentro de cada rombo, una tijera o una navaja, alternadas (siluetas rellenas).
    Las piezas se dibujan verticales y centradas en 0,0, y se giran al ubicarlas.
  -->
  <defs>
    <!-- Tijera: puntas arriba, anillos abajo -->
    <g id="scissors">
      <path d="M-0.4 5 L-6.4 -27 C-6.8 -29 -4.6 -29.6 -4.2 -27.6 L2.2 4 Z" />
      <path d="M0.4 5 L6.4 -27 C6.8 -29 4.6 -29.6 4.2 -27.6 L-2.2 4 Z" />
      <path d="M-2.2 3.5 L-7.4 16.5 L-4.2 17.6 L1.2 6 Z" />
      <path d="M2.2 3.5 L7.4 16.5 L4.2 17.6 L-1.2 6 Z" />
      <path fill-rule="evenodd" d="M-8.5 15.5 a6.8 6.8 0 1 0 0.01 0 Z M-8.5 18.6 a3.7 3.7 0 1 1 -0.01 0 Z" />
      <path fill-rule="evenodd" d="M8.5 15.5 a6.8 6.8 0 1 1 -0.01 0 Z M8.5 18.6 a3.7 3.7 0 1 0 0.01 0 Z" />
      <circle cx="0" cy="4.6" r="1.1" fill="#0a0a0a" />
    </g>
    <!-- Navaja abierta en V: mango largo con remaches y la hoja separada, unidos en el remache de arriba -->
    <g id="razor">
      <path d="M-1 -24 L-14.2 0.6 C-15.5 3 -20 2 -21.2 -3.2 L-8 -27.8 C-6 -30 -2 -28 -1 -24 Z" />
      <path d="M3 -27 C5 -30 8 -31 10 -34 C11 -35 12.4 -33.4 11.4 -32 C9.6 -29 7 -27 3 -25 Z" />
      <path fill-rule="evenodd" d="M-2.6 -26 C-2 -10 -1.5 10 -1 26 C-0.8 30 5 30 4.8 26 C4.5 10 3.6 -10 3 -26 C3 -30 -2.6 -30 -2.6 -26 Z M0.2 -26.4 a1.4 1.4 0 1 0 0.01 0 Z M1.9 23.6 a1.2 1.2 0 1 0 0.01 0 Z" />
    </g>
    <!-- Tijera y navaja alternadas: una por rombo, inclinadas como en un cartel de barbería -->
    <use id="s1" href="#scissors" transform="rotate(38) scale(1.15)" />
    <use id="r1" href="#razor" transform="rotate(-128) translate(6 0) scale(1.1)" />
    <!-- Estrella de 4 puntas para los cruces de la grilla -->
    <path id="star" d="M0 -6 L1.3 -1.3 L6 0 L1.3 1.3 L0 6 L-1.3 1.3 L-6 0 L-1.3 -1.3 Z" />
  </defs>

  <g fill="#f3eae0">
    <!-- Rombo punteado que une los puntos medios de los bordes -->
    <path d="M90 0 L180 90 L90 180 L0 90 Z" fill="none" stroke="#f3eae0" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="0 6.4" />

    <!-- Estrellas en los cruces (las de los bordes se completan con la repetición) -->
    <use href="#star" x="90" y="0" />
    <use href="#star" x="90" y="180" />
    <use href="#star" x="0" y="90" />
    <use href="#star" x="180" y="90" />

    <!-- Tijera al centro; navajas en las esquinas (que juntas forman el rombo vecino) -->
    <use href="#s1" x="90" y="90" />
    <use href="#r1" x="0" y="0" />
    <use href="#r1" x="180" y="0" />
    <use href="#r1" x="0" y="180" />
    <use href="#r1" x="180" y="180" />
  </g>
</svg>
