name: Avisos de WhatsApp

# PAUSADO: las ejecuciones programadas están desactivadas hasta contar con el número de WhatsApp
# y el gateway. Mientras tanto el workflow solo corre a mano (Actions > Avisos de WhatsApp > Run workflow).
#
# Para reactivarlo:
#   1. Cargar los secrets APP_URL y CRON_SECRET (Settings > Secrets and variables > Actions).
#   2. Configurar el gateway de WhatsApp en Vercel (WHATSAPP_GATEWAY_URL, _INSTANCE y _TOKEN).
#   3. Descomentar el bloque `schedule` de abajo.
#
# GitHub Actions usa UTC. Argentina es UTC-3 todo el año (sin horario de verano).
on:
  # schedule:
  #   - cron: "30 11 * * *" # 08:30 ART: aviso matutino
  #   - cron: "*/15 * * * *" # cada 15 min: aviso 1 h antes
  workflow_dispatch:

jobs:
  call:
    runs-on: ubuntu-latest
    steps:
      - name: Aviso matutino
        if: github.event.schedule == '30 11 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl --fail-with-body -sS -X POST "${{ secrets.APP_URL }}/api/cron/morning" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
      - name: Aviso 1 hora antes
        if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl --fail-with-body -sS -X POST "${{ secrets.APP_URL }}/api/cron/proximity" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
